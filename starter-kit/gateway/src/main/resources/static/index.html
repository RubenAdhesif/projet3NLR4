<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Lab — Dashboard</title>
  <meta name="description" content="Real-time Web of Things dashboard for the Smart Lab: lamp, thermostat and motion sensor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens ─────────────────────────────────────────────────────── */
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-alt: #1c2128;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-dim:    #7d8590;
      --text-muted:  #484f58;
      --accent:      #388bfd;
      --accent-dim:  #1f4e9e;
      --green:       #2ea043;
      --green-dim:   #1a3d26;
      --red:         #f85149;
      --red-dim:     #5a1d1a;
      --amber:       #d29922;
      --amber-dim:   #3d2800;
      --radius:      10px;
      --mono:        'JetBrains Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 2rem;
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
    }
    .header-logo {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    h1 { font-size: 1rem; font-weight: 600; letter-spacing: -.01em; }
    .subtitle { font-size: .75rem; color: var(--text-dim); }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .token-wrap {
      display: flex; gap: .4rem; align-items: center;
    }
    .token-label { font-size: .75rem; color: var(--text-dim); white-space: nowrap; }
    input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: .78rem;
      padding: .35rem .6rem;
      width: 170px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    .status-badge {
      display: flex; align-items: center; gap: .4rem;
      font-size: .75rem; color: var(--text-dim);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .3rem .7rem;
      white-space: nowrap;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      transition: background .4s;
    }
    .status-dot.online  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.offline { background: var(--red); }

    .btn {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text);
      font-size: .8rem;
      font-weight: 500;
      padding: .35rem .8rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--border); }
    .btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--text); }
    .btn.primary:hover { background: var(--accent); }
    .btn:active { opacity: .7; }

    /* ── Layout ────────────────────────────────────────────────────────────── */
    main {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }

    /* ── Cards ─────────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .25s;
    }
    .card.active { border-color: var(--accent-dim); }

    .card-header {
      padding: .9rem 1rem .7rem;
      display: flex; align-items: center; gap: .7rem;
      border-bottom: 1px solid var(--border);
    }
    .card-icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 16px; flex-shrink: 0;
    }
    .card-icon.lamp   { background: rgba(210,153,34,.12); }
    .card-icon.therm  { background: rgba(56,139,253,.12); }
    .card-icon.motion { background: rgba(46,160,67,.12);  }

    .card-meta { flex: 1; }
    .card-name { font-size: .9rem; font-weight: 600; }
    .card-id   { font-size: .72rem; color: var(--text-dim); font-family: var(--mono); }
    .thing-status {
      font-size: .7rem; font-weight: 500;
      padding: .15rem .5rem;
      border-radius: 20px;
      border: 1px solid currentColor;
      opacity: .8;
    }
    .thing-status.online { color: var(--green); }
    .thing-status.offline{ color: var(--text-muted); border-color: var(--border); }

    .card-body { padding: 1rem; display: flex; flex-direction: column; gap: .9rem; }

    /* ── Property rows ──────────────────────────────────────────────────────── */
    .prop-row {
      display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    }
    .prop-label {
      font-size: .78rem; color: var(--text-dim);
      font-family: var(--mono);
    }
    .prop-value {
      font-size: .85rem; font-weight: 500;
      font-family: var(--mono);
      color: var(--text);
      text-align: right;
    }

    /* ── Toggle switch ──────────────────────────────────────────────────────── */
    .toggle-wrap { display: flex; align-items: center; gap: .5rem; }
    .switch { position: relative; display: inline-flex; width: 38px; height: 22px; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--border);
      border-radius: 22px;
      transition: background .2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      left: 3px; bottom: 3px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform .2s;
    }
    input:checked + .slider { background: var(--amber); }
    input:checked + .slider::before { transform: translateX(16px); }

    /* ── Brightness slider ──────────────────────────────────────────────────── */
    .range-wrap { display: flex; flex-direction: column; gap: .4rem; }
    .range-row  { display: flex; align-items: center; gap: .6rem; }
    input[type="range"] {
      flex: 1; height: 4px; cursor: pointer;
      -webkit-appearance: none; appearance: none;
      border-radius: 4px;
      background: var(--border);
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }
    .range-val { font-family: var(--mono); font-size: .78rem; width: 2.4rem; text-align: right; }

    /* ── Temperature display ────────────────────────────────────────────────── */
    .temp-display {
      display: flex; flex-direction: column; align-items: center;
      padding: .5rem 0;
    }
    .temp-big {
      font-size: 2.6rem; font-weight: 300; line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
    }
    .temp-unit { font-size: 1rem; color: var(--text-dim); font-weight: 300; }
    .temp-sub  { font-size: .75rem; color: var(--text-dim); margin-top: .25rem; }

    /* ── Mode buttons ───────────────────────────────────────────────────────── */
    .mode-group { display: flex; gap: .4rem; }
    .mode-btn {
      flex: 1;
      padding: .4rem .3rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-dim);
      font-size: .75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .mode-btn:hover { border-color: var(--accent); color: var(--text); }
    .mode-btn.active-off  { background: var(--surface-alt); border-color: var(--text-dim); color: var(--text); }
    .mode-btn.active-heat { background: rgba(210,153,34,.2); border-color: var(--amber); color: var(--amber); }
    .mode-btn.active-eco  { background: rgba(46,160,67,.2); border-color: var(--green); color: var(--green); }

    /* ── Target temperature ─────────────────────────────────────────────────── */
    .target-row { display: flex; align-items: center; gap: .5rem; }
    .target-row input[type="number"] {
      width: 70px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: .85rem;
      padding: .35rem .5rem;
      outline: none;
      text-align: center;
      transition: border-color .15s;
    }
    .target-row input[type="number"]:focus { border-color: var(--accent); }

    /* ── Motion sensor ──────────────────────────────────────────────────────── */
    .motion-trigger {
      display: flex; flex-direction: column; align-items: center;
      gap: .6rem; padding: .4rem 0;
    }
    .motion-ring {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: grid; place-items: center;
      font-size: 24px;
      transition: border-color .3s, background .3s, box-shadow .3s;
      cursor: pointer;
    }
    .motion-ring.pulse {
      border-color: var(--green);
      background: rgba(46,160,67,.1);
      box-shadow: 0 0 0 8px rgba(46,160,67,.15), 0 0 0 16px rgba(46,160,67,.06);
    }
    .motion-ring:hover { border-color: var(--accent); }
    .motion-ts { font-size: .72rem; font-family: var(--mono); color: var(--text-dim); text-align: center; }

    /* ── Separator ──────────────────────────────────────────────────────────── */
    hr { border: none; border-top: 1px solid var(--border); }

    /* ── Event console ──────────────────────────────────────────────────────── */
    .console-wrap {
      max-width: 1140px;
      margin: 1rem auto 0;
      padding: 0 1.5rem;
    }
    .console-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: .5rem;
    }
    .console-title {
      font-size: .78rem; font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .console {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem;
      height: 180px;
      overflow-y: auto;
      font-family: var(--mono);
      font-size: .72rem;
      line-height: 1.6;
    }
    .log-line { display: flex; gap: .7rem; }
    .log-ts   { color: var(--text-muted); white-space: nowrap; }
    .log-tag  { 
      padding: 0 .4rem; border-radius: 3px; font-size: .65rem;
      font-weight: 600; white-space: nowrap; align-self: center;
    }
    .log-tag.motion        { background: rgba(46,160,67,.25);  color: var(--green); }
    .log-tag.propertyChanged { background: rgba(56,139,253,.2); color: var(--accent); }
    .log-tag.targetReached { background: rgba(210,153,34,.2);  color: var(--amber); }
    .log-tag.registry      { background: rgba(125,133,144,.2); color: var(--text-dim); }
    .log-tag.other         { background: rgba(125,133,144,.15); color: var(--text-dim); }
    .log-body { color: var(--text); word-break: break-all; }

    /* ── Utility ────────────────────────────────────────────────────────────── */
    .divider { border-top: 1px solid var(--border); }

    @keyframes flash {
      0%   { opacity: 1; }
      50%  { opacity: .4; }
      100% { opacity: 1; }
    }
    .flash { animation: flash .4s ease; }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header>
  <div class="header-title">
    <div class="header-logo">WoT</div>
    <div>
      <h1>Smart Lab</h1>
      <div class="subtitle">Web of Things Gateway · localhost:8080</div>
    </div>
  </div>
  <div class="header-controls">
    <div class="token-wrap">
      <span class="token-label">Token</span>
      <input id="token-input" type="text" value="operator-secret" spellcheck="false">
    </div>
    <div id="sse-status" class="status-badge">
      <span class="status-dot" id="sse-dot"></span>
      <span id="sse-label">Disconnected</span>
    </div>
    <button class="btn primary" onclick="connect()">Connect</button>
    <button class="btn" onclick="refreshAll()">Refresh</button>
  </div>
</header>

<!-- ── Thing cards ──────────────────────────────────────────────────────────── -->
<main>

  <!-- Lamp card -->
  <div class="card" id="card-lamp">
    <div class="card-header">
      <div class="card-icon lamp">💡</div>
      <div class="card-meta">
        <div class="card-name">Lamp</div>
        <div class="card-id">lamp · :8082</div>
      </div>
      <span class="thing-status offline" id="status-lamp">offline</span>
    </div>
    <div class="card-body">
      <div class="prop-row">
        <span class="prop-label">on</span>
        <div class="toggle-wrap">
          <span class="prop-value" id="lamp-on-label">—</span>
          <label class="switch">
            <input type="checkbox" id="lamp-on-toggle" onchange="setLampOn(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="divider"></div>
      <div class="range-wrap">
        <div class="prop-row">
          <span class="prop-label">brightness</span>
          <span class="prop-value" id="lamp-brightness-label">—</span>
        </div>
        <div class="range-row">
          <span style="font-size:.75rem;color:var(--text-dim)">0</span>
          <input type="range" id="lamp-brightness-slider" min="0" max="100" value="80"
                 oninput="document.getElementById('lamp-brightness-label').textContent = this.value + '%'"
                 onchange="setBrightness(+this.value)">
          <span style="font-size:.75rem;color:var(--text-dim)">100</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Thermostat card -->
  <div class="card" id="card-thermostat">
    <div class="card-header">
      <div class="card-icon therm">🌡</div>
      <div class="card-meta">
        <div class="card-name">Thermostat</div>
        <div class="card-id">thermostat · :8081</div>
      </div>
      <span class="thing-status offline" id="status-thermostat">offline</span>
    </div>
    <div class="card-body">
      <div class="temp-display">
        <div>
          <span class="temp-big" id="therm-temp">—</span>
          <span class="temp-unit">°C</span>
        </div>
        <div class="temp-sub">current temperature</div>
      </div>
      <div class="divider"></div>
      <div class="prop-row">
        <span class="prop-label">mode</span>
        <div class="mode-group" id="mode-group">
          <button class="mode-btn" id="mode-off"  onclick="setMode('off')" >off</button>
          <button class="mode-btn" id="mode-heat" onclick="setMode('heat')">heat</button>
          <button class="mode-btn" id="mode-eco"  onclick="setMode('eco')" >eco</button>
        </div>
      </div>
      <div class="prop-row">
        <span class="prop-label">target</span>
        <div class="target-row">
          <input type="number" id="therm-target" value="19" step="0.5" min="10" max="30">
          <button class="btn" onclick="setTarget(+document.getElementById('therm-target').value)">Set</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Motion sensor card -->
  <div class="card" id="card-motion">
    <div class="card-header">
      <div class="card-icon motion">📡</div>
      <div class="card-meta">
        <div class="card-name">Motion Sensor</div>
        <div class="card-id">motion · :8083</div>
      </div>
      <span class="thing-status offline" id="status-motion">offline</span>
    </div>
    <div class="card-body">
      <div class="motion-trigger">
        <div class="motion-ring" id="motion-ring" onclick="simulateMotion()" title="Click to simulate motion">
          👤
        </div>
        <button class="btn primary" onclick="simulateMotion()">Simulate motion</button>
        <div class="motion-ts" id="motion-ts">No motion recorded</div>
      </div>
      <div class="divider"></div>
      <div class="prop-row">
        <span class="prop-label">lastMotion</span>
        <span class="prop-value" id="motion-last" style="font-size:.7rem; max-width: 200px; word-break:break-all; text-align:right">—</span>
      </div>
    </div>
  </div>
</main>

<!-- ── Event console ─────────────────────────────────────────────────────────── -->
<div class="console-wrap">
  <div class="console-header">
    <span class="console-title">Live Event Stream</span>
    <button class="btn" onclick="clearLog()">Clear</button>
  </div>
  <div class="console" id="console"></div>
</div>

<script>
  // ── Helpers ────────────────────────────────────────────────────────────────

  const token = () => document.getElementById('token-input').value.trim();
  const authHeaders = () => ({ 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' });

  async function api(method, path, body) {
    const opts = { method, headers: authHeaders() };
    if (body !== undefined) opts.body = JSON.stringify(body);
    try {
      const res = await fetch(path, opts);
      return res.ok ? await res.json().catch(() => null) : null;
    } catch { return null; }
  }

  function flash(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
  }

  function ts() {
    return new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // ── Event console ──────────────────────────────────────────────────────────

  function log(tag, body, tagClass) {
    const cons = document.getElementById('console');
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `
      <span class="log-ts">${ts()}</span>
      <span class="log-tag ${tagClass || 'other'}">${tag}</span>
      <span class="log-body">${typeof body === 'string' ? body : JSON.stringify(body)}</span>`;
    cons.prepend(line);
    // Keep at most 200 lines
    while (cons.children.length > 200) cons.lastChild.remove();
  }

  function clearLog() { document.getElementById('console').innerHTML = ''; }

  // ── Thing status helpers ───────────────────────────────────────────────────

  function setOnline(id) {
    const badge = document.getElementById('status-' + id);
    if (!badge) return;
    badge.textContent = 'online';
    badge.className = 'thing-status online';
    document.getElementById('card-' + id)?.classList.add('active');
  }

  // ── Lamp ───────────────────────────────────────────────────────────────────

  function updateLamp({ on, brightness }) {
    if (on !== undefined) {
      document.getElementById('lamp-on-toggle').checked = on;
      const label = document.getElementById('lamp-on-label');
      label.textContent = on ? 'ON' : 'OFF';
      label.style.color = on ? 'var(--amber)' : 'var(--text-dim)';
    }
    if (brightness !== undefined) {
      document.getElementById('lamp-brightness-slider').value = brightness;
      document.getElementById('lamp-brightness-label').textContent = brightness + '%';
    }
    setOnline('lamp');
    flash('card-lamp');
  }

  async function loadLamp() {
    const data = await api('GET', '/things/lamp/properties');
    if (data) updateLamp(data);
  }

  async function setLampOn(value) {
    await api('PUT', '/things/lamp/properties/on', { value });
    updateLamp({ on: value });
  }

  async function setBrightness(value) {
    await api('POST', '/things/lamp/actions/setBrightness', { value });
    updateLamp({ brightness: value });
  }

  // ── Thermostat ─────────────────────────────────────────────────────────────

  function updateThermostat({ temperature, target, mode }) {
    if (temperature !== undefined) {
      document.getElementById('therm-temp').textContent = Number(temperature).toFixed(1);
    }
    if (target !== undefined) {
      document.getElementById('therm-target').value = target;
    }
    if (mode !== undefined) {
      ['off', 'heat', 'eco'].forEach(m => {
        const btn = document.getElementById('mode-' + m);
        btn.className = 'mode-btn' + (m === mode ? ' active-' + m : '');
      });
    }
    setOnline('thermostat');
    flash('card-thermostat');
  }

  async function loadThermostat() {
    const data = await api('GET', '/things/thermostat/properties');
    if (data) updateThermostat(data);
  }

  async function setMode(m) {
    await api('PUT', '/things/thermostat/properties/mode', { value: m });
    updateThermostat({ mode: m });
    log('propertyChanged', `thermostat.mode = ${m}`, 'propertyChanged');
  }

  async function setTarget(value) {
    await api('PUT', '/things/thermostat/properties/target', { value });
    updateThermostat({ target: value });
    log('propertyChanged', `thermostat.target = ${value}°C`, 'propertyChanged');
  }

  // ── Motion sensor ──────────────────────────────────────────────────────────

  function updateMotion({ lastMotion }) {
    if (lastMotion !== undefined && lastMotion !== 'null' && lastMotion) {
      const d = new Date(lastMotion);
      document.getElementById('motion-ts').textContent =
        'Last: ' + d.toLocaleTimeString([], { hour12: false });
      document.getElementById('motion-last').textContent = lastMotion;
    }
    setOnline('motion');
  }

  async function loadMotion() {
    const data = await api('GET', '/things/motion/properties');
    if (data) updateMotion(data);
  }

  let motionPulseTimer;
  function pulseMotion() {
    const ring = document.getElementById('motion-ring');
    ring.classList.add('pulse');
    clearTimeout(motionPulseTimer);
    motionPulseTimer = setTimeout(() => ring.classList.remove('pulse'), 3000);
  }

  async function simulateMotion() {
    await api('POST', '/things/motion/actions/simulateMotion', {});
    // The SSE event will update the UI; we just give immediate visual feedback
    pulseMotion();
  }

  // ── Refresh all ────────────────────────────────────────────────────────────

  async function refreshAll() {
    await Promise.all([loadLamp(), loadThermostat(), loadMotion()]);
  }

  // ── SSE connection ─────────────────────────────────────────────────────────

  let evtSource;

  function connect() {
    if (evtSource) { evtSource.close(); evtSource = null; }
    setSseStatus('connecting');

    evtSource = new EventSource('/events/stream?token=' + encodeURIComponent(token()));

    evtSource.addEventListener('hello', () => {
      setSseStatus('online');
      refreshAll();
    });

    evtSource.addEventListener('thing', e => {
      const ev = JSON.parse(e.data);
      handleThingEvent(ev);
    });

    evtSource.addEventListener('registry', e => {
      const ev = JSON.parse(e.data);
      log('registry', ev.type + ' · ' + ev.thingId, 'registry');
    });

    evtSource.onerror = () => {
      setSseStatus('offline');
    };
  }

  function setSseStatus(state) {
    const dot   = document.getElementById('sse-dot');
    const label = document.getElementById('sse-label');
    dot.className   = 'status-dot ' + (state === 'online' ? 'online' : state === 'offline' ? 'offline' : '');
    label.textContent = state === 'online' ? 'Connected' : state === 'connecting' ? 'Connecting…' : 'Disconnected';
  }

  function handleThingEvent(ev) {
    const { thingId, type, data } = ev;

    // Log to console
    const tagClass = ['motion', 'propertyChanged', 'targetReached'].includes(type) ? type : 'other';
    log(type, `${thingId}: ${JSON.stringify(data || {})}`, tagClass);

    // Update the relevant card
    if (thingId === 'lamp' && type === 'propertyChanged') {
      updateLamp({ [data.property]: data.value });
    }
    if (thingId === 'thermostat' && type === 'propertyChanged') {
      updateThermostat({ [data.property]: data.value });
    }
    if (thingId === 'thermostat' && type === 'targetReached') {
      // R2 completion: thermostat just reached its target → visual feedback
      flash('card-thermostat');
    }
    if (thingId === 'motion' && type === 'motion') {
      pulseMotion();
      // Refresh motion properties to get the new lastMotion timestamp
      loadMotion();
    }
  }

  // ── Init ───────────────────────────────────────────────────────────────────

  connect();
</script>
</body>
</html>
